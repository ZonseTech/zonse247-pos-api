# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  SCRIPT: ./scripts/db.sh
  BASH: '{{if eq OS "windows"}}C:/Program Files/Git/bin/bash.exe{{else}}bash{{end}}'

tasks:
  # Help and info
  default:
    desc: Show available commands
    cmds:
      - task --list-all

  help:
    desc: Show detailed help from db script
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} help mysql'

  # MySQL tasks
  gen:mysql:
    desc: Generate Prisma client for MySQL
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} generate mysql'

  migrate:mysql:
    desc: Create and apply migration for MySQL
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} migrate mysql {{.CLI_ARGS}}'

  create:mysql:
    desc: Create migration without applying (MySQL)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} create mysql {{.CLI_ARGS}}'

  push:mysql:
    desc: Push schema changes to MySQL (no migration)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} push mysql'

  studio:mysql:
    desc: Open Prisma Studio for MySQL
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} studio mysql'

  deploy:mysql:
    desc: Deploy pending migrations to MySQL (production)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} deploy mysql'

  status:mysql:
    desc: Check migration status for MySQL
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} status mysql'

  format:mysql:
    desc: Format MySQL schema file
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} format mysql'

  validate:mysql:
    desc: Validate MySQL schema
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} validate mysql'

  reset:mysql:
    desc: Reset MySQL database (DESTRUCTIVE!)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} reset mysql'

  # SQLite tasks
  gen:sqlite:
    desc: Generate Prisma client for SQLite
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} generate sqlite'

  migrate:sqlite:
    desc: Create and apply migration for SQLite
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} migrate sqlite {{.CLI_ARGS}}'

  create:sqlite:
    desc: Create migration without applying (SQLite)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} create sqlite {{.CLI_ARGS}}'

  push:sqlite:
    desc: Push schema changes to SQLite (no migration)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} push sqlite'

  studio:sqlite:
    desc: Open Prisma Studio for SQLite
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} studio sqlite'

  deploy:sqlite:
    desc: Deploy pending migrations to SQLite (production)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} deploy sqlite'

  status:sqlite:
    desc: Check migration status for SQLite
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} status sqlite'

  format:sqlite:
    desc: Format SQLite schema file
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} format sqlite'

  validate:sqlite:
    desc: Validate SQLite schema
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} validate sqlite'

  reset:sqlite:
    desc: Reset SQLite database (DESTRUCTIVE!)
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} reset sqlite'

  # Initialize separate migration directories
  init:mysql:
    desc: Initialize separate migration directory for MySQL
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} init mysql'

  init:sqlite:
    desc: Initialize separate migration directory for SQLite
    cmds:
      - '"{{.BASH}}" {{.SCRIPT}} init sqlite'

  # Convenience tasks for both databases
  gen:all:
    desc: Generate Prisma clients for both databases
    cmds:
      - task: gen:mysql
      - task: gen:sqlite

  validate:all:
    desc: Validate both schemas
    cmds:
      - task: validate:mysql
      - task: validate:sqlite

  format:all:
    desc: Format both schema files
    cmds:
      - task: format:mysql
      - task: format:sqlite

  status:all:
    desc: Check migration status for both databases
    cmds:
      - task: status:mysql
      - task: status:sqlite

  # Data Migration
  migrate:transactions:
    desc: Migrate transactions to sales module (one-off)
    cmds:
      - npx ts-node scripts/migrate-transactions-to-sales.ts {{.CLI_ARGS}}

  migrate:transactions:dry:
    desc: Preview transaction migration (dry run)
    cmds:
      - npx ts-node scripts/migrate-transactions-to-sales.ts --dry-run

  # Migration Management (Laravel-style)
  make:migration:
    desc: Create a new migration file (like Laravel artisan make:migration)
    cmds:
      - npx ts-node scripts/make-migration.ts {{.CLI_ARGS}}

  migrate:status:
    desc: Show target version and list all migrations
    cmds:
      - |
        npx ts-node -e "
        const { getAllMigrations, CURRENT_DB_VERSION } = require('./src/databases/prisma/migrations');
        const migrations = getAllMigrations();
        console.log('');
        console.log('Migration Status');
        console.log('   Target version:', CURRENT_DB_VERSION);
        console.log('   Total migrations:', migrations.length);
        console.log('   Note: Run the app to check db_meta for current DB version');
        console.log('');
        "

  migrate:list:
    desc: List all available migrations
    cmds:
      - |
        npx ts-node -e "
        const { getAllMigrations } = require('./src/databases/prisma/migrations');
        const migrations = getAllMigrations();
        console.log('');
        console.log('Available Migrations (' + migrations.length + ' total)');
        console.log('');
        migrations.forEach(m => {
          console.log('  ' + m.version + ' - ' + m.description);
        });
        console.log('');
        "
