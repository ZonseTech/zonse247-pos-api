name: Promote develop to main

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  promotion-ci:
    name: Develop → Main CI
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./test.db"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗃️ Setup SQLite schema
        run: |
          chmod +x ./scripts/db.sh
          ./scripts/db.sh generate sqlite

      - name: 🔍 Type check
        run: npx tsc --noEmit

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 🏗️ Build project (SQLite)
        run: npm run build:sqlite

      - name: 🧪 Run tests
        run: npm test
