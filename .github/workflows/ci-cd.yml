name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Default to SQLite for CI testing (faster, no external DB required)
  DATABASE_URL: "file:./test.db"

jobs:
  # SQLite-based testing (default for CI - fast and portable)
  test-sqlite:
    name: Test (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗃️ Setup SQLite schema
        run: |
          chmod +x ./scripts/db.sh
          ./scripts/db.sh generate sqlite

      - name: 🔍 Type check
        run: npx tsc --noEmit

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 🏗️ Build project (SQLite)
        run: npm run build:sqlite

      - name: 🧪 Run tests
        run: npm test

  # MySQL-based testing (for production parity)
  test-mysql:
    name: Test (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: pos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "mysql://root:testpassword@localhost:3306/pos_test"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗃️ Setup MySQL schema
        run: |
          chmod +x ./scripts/db.sh
          ./scripts/db.sh generate mysql
          ./scripts/db.sh push mysql

      - name: 🔍 Type check
        run: npx tsc --noEmit

      - name: 🏗️ Build project (MySQL)
        run: npm run build:mysql

      - name: 🧪 Run tests
        run: npm test

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Run security audit
        run: npm audit --omit=dev --audit-level critical
