name: Release Package (SQLite)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build & Release (SQLite Package)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./release.db"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗃️ Setup SQLite schema
        run: |
          chmod +x ./scripts/db.sh
          ./scripts/db.sh generate sqlite

      - name: 🧪 Run tests
        run: npm run test:ci

      - name: 🏗️ Build package (SQLite)
        run: npm run build:package

      - name: 📦 Create package tarball and set output
        id: pack
        run: |
          npm pack
          PACKAGE_NAME=$(npm pack --quiet)
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Created package: $PACKAGE_NAME"

      - name: 📤 Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-sqlite
          path: ${{ steps.pack.outputs.name }}

      - name: 🎉 Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.pack.outputs.name }}
          generate_release_notes: true
          body: |
            ## SQLite Package Release

            This release contains the SQLite-based package for local/desktop deployments.

            ### Installation
            ```bash
            npm install ${{ steps.pack.outputs.name }}
            ```

            ### Database
            - **Type**: SQLite (embedded)
            - **For server deployments with MySQL**, use the deployment workflow instead.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
