name: Deploy to Ubuntu Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  probe:
    name: Read server Node version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node-major: ${{ steps.version.outputs.major }}

    steps:
      - name: 🔎 Ask the server
        id: ssh
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USERNAME }}
          key: ${{ secrets.API_SSH_KEY }}
          capture_stdout: true
          script: echo "NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")"

      - name: 📌 Record version
        id: version
        env:
          STDOUT: ${{ steps.ssh.outputs.stdout }}
        run: |
          MAJOR="$(echo "$STDOUT" | grep -oE 'NODE_MAJOR=[0-9]+' | tail -n 1 | cut -d= -f2)"
          if [ -z "$MAJOR" ]; then
            echo "❌ Could not read the server's Node version"
            exit 1
          fi
          echo "Server runs Node $MAJOR"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Test
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: pos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "mysql://root:ci-test-password@localhost:3306/pos"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Node.js ${{ needs.probe.outputs.node-major }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.probe.outputs.node-major }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗃️ Setup MySQL schema & generate clients
        run: |
          chmod +x ./scripts/db.sh
          ./scripts/db.sh generate mysql
          ./scripts/db.sh push mysql

      - name: 🔍 Type check
        run: npx tsc --noEmit

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build project
        run: npm run build:mysql

      - name: 📦 Install production dependencies only
        run: npm ci --omit=dev

      - name: 🗜️ Package release
        run: tar -czf api.tar.gz dist node_modules package.json package-lock.json ecosystem.config.js

      - name: 📤 Upload release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-${{ github.sha }}
          path: api.tar.gz
          retention-days: 7

  deploy:
    name: Release to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: 📥 Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-${{ github.sha }}

      - name: 📤 Upload release to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USERNAME }}
          key: ${{ secrets.API_SSH_KEY }}
          source: api.tar.gz
          target: /var/www/api-app/incoming/${{ github.sha }}

      - name: 🚀 Activate release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USERNAME }}
          key: ${{ secrets.API_SSH_KEY }}
          envs: SHA
          command_timeout: 10m
          script: |
            set -eu

            BASE=/var/www/api-app
            LEGACY=/var/www/api
            RELEASE="$BASE/releases/$SHA"
            PREFLIGHT_PORT=3101
            SHORT="$(echo "$SHA" | cut -c1-7)"

            healthy() {
              for attempt in $(seq 1 45); do
                curl -fs -o /dev/null "http://127.0.0.1:$1/health" && return 0
                sleep 2
              done
              return 1
            }

            mkdir -p "$RELEASE" "$BASE/shared/logs" "$BASE/shared/storage"

            if [ ! -f "$BASE/shared/.env" ]; then
              if [ -f "$LEGACY/.env" ]; then
                cp -p "$LEGACY/.env" "$BASE/shared/.env"
                echo "📋 Copied .env from $LEGACY"
              else
                echo "❌ No .env in $BASE/shared or $LEGACY"
                exit 1
              fi
            fi
            if [ -d "$LEGACY/storage" ] && [ -z "$(ls -A "$BASE/shared/storage")" ]; then
              cp -a "$LEGACY/storage/." "$BASE/shared/storage/"
              echo "📋 Copied storage from $LEGACY"
            fi

            tar -xzf "$BASE/incoming/$SHA/api.tar.gz" -C "$RELEASE"
            rm -rf "$BASE/incoming/$SHA"
            ln -sfn "$BASE/shared/.env" "$RELEASE/.env"
            ln -sfn "$BASE/shared/storage" "$RELEASE/storage"
            ln -sfn "$BASE/shared/logs" "$RELEASE/logs"

            PORT="$(sed -n 's/^SERVER_PORT=["]\{0,1\}\([0-9]*\).*/\1/p' "$BASE/shared/.env" | tail -n 1)"
            PORT="${PORT:-3000}"

            echo "🧪 Pre-flight check for $SHORT on port $PREFLIGHT_PORT..."
            PREFLIGHT_LOG="$BASE/shared/logs/preflight.log"
            (cd "$RELEASE" && echo "node $(node -v) at $(command -v node)" && exec env NODE_ENV=production SERVER_PORT=$PREFLIGHT_PORT node dist/main.js) > "$PREFLIGHT_LOG" 2>&1 < /dev/null &
            PREFLIGHT_PID=$!
            if ! healthy "$PREFLIGHT_PORT"; then
              echo "❌ $SHORT failed pre-flight; production untouched"
              if kill -0 "$PREFLIGHT_PID" 2>/dev/null; then
                echo "Pre-flight process is still running but never answered /health"
                kill "$PREFLIGHT_PID" 2>/dev/null || true
              else
                STATUS=0
                wait "$PREFLIGHT_PID" || STATUS=$?
                echo "Pre-flight process exited with status $STATUS"
              fi
              echo "--- preflight.log ($(wc -c < "$PREFLIGHT_LOG") bytes) ---"
              tail -n 60 "$PREFLIGHT_LOG" || true
              echo "--- release contents ---"
              ls -la "$RELEASE" || true
              ls "$RELEASE/dist" | head -n 20 || true
              rm -rf "$RELEASE"
              exit 1
            fi
            kill "$PREFLIGHT_PID" 2>/dev/null || true

            pm2_cwd() {
              pm2 jlist 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s.slice(s.indexOf('['))).find(p=>p.name==='api');process.stdout.write(a?a.pm2_env.pm_cwd:'')}catch{}})"
            }

            PREVIOUS=""
            if [ -L "$BASE/current" ]; then
              PREVIOUS="$(readlink -f "$BASE/current")"
            fi

            switch_to() {
              ln -sfn "$1" "$BASE/current.next"
              mv -Tf "$BASE/current.next" "$BASE/current"
              case "$(pm2_cwd)" in
                "$BASE"/*)
                  pm2 startOrReload "$BASE/current/ecosystem.config.js" --env production --update-env
                  ;;
                *)
                  pm2 delete api >/dev/null 2>&1 || true
                  pm2 start "$BASE/current/ecosystem.config.js" --env production
                  ;;
              esac
            }

            switch_to "$RELEASE"

            if healthy "$PORT"; then
              pm2 save
              ls -1dt "$BASE"/releases/* | tail -n +6 | xargs -r rm -rf
              echo "✅ Released $SHORT on port $PORT"
              exit 0
            fi

            echo "❌ $SHORT unhealthy after switch"
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              switch_to "$PREVIOUS"
              healthy "$PORT" && echo "↩️ Rolled back to $(basename "$PREVIOUS" | cut -c1-7)"
            elif [ -f "$LEGACY/ecosystem.config.js" ]; then
              pm2 delete api >/dev/null 2>&1 || true
              pm2 start "$LEGACY/ecosystem.config.js" --env production
              healthy "$PORT" && echo "↩️ Rolled back to the $LEGACY checkout"
            fi
            exit 1
