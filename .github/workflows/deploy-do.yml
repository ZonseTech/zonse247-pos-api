name: Deploy to Ubuntu Server

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🚀 Checkout code
        uses: actions/checkout@v4

      - name: 🔨 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Run tests
        run: npm test

      - name: 🔍 Type check
        run: npx tsc --noEmit

      - name: 🏗️ Build project
        run: npm run build

      - name: 📤 Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.API_HOST }}
          username: ${{ secrets.API_USERNAME }}
          key: ${{ secrets.API_SSH_KEY }}
          script: |
            # Create directory if it doesn't exist
            mkdir -p /var/www/pos-api
            cd /var/www/pos-api

            # Check if it's a git repository
            if [ ! -d .git ]; then
              echo "🔄 Initial clone..."
              git clone https://github.com/ZonseTech/zonse247-pos-api.git /var/www/pos-api-temp
              mv /var/www/pos-api-temp/* /var/www/pos-api/
              mv /var/www/pos-api-temp/.* /var/www/pos-api/ 2>/dev/null || true
              rm -rf /var/www/pos-api-temp
            else
              echo "🔄 Resetting local changes and pulling..."
              git reset --hard HEAD
              git clean -fd
              git pull origin main --force
            fi

            # Make scripts executable and deploy
            chmod +x deploy.sh
            ./deploy.sh production
